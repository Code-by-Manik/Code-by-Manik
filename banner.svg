<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#0D1B12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2b1f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="220" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="220" rx="16" fill="url(#grid)" opacity="0.5"/>
  <rect x="3" y="3" width="794" height="214" rx="14" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.8"/>

  <circle cx="28" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="28" r="6" fill="#27C93F"/>
  <text x="400" y="33" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#5a6b5e">manik@github: ~</text>

  <clipPath id="clipLine1">
    <rect x="0" y="70" width="0" height="50">
      <animate attributeName="width" from="0" to="800" dur="1.1s" begin="0.3s" fill="freeze"/>
    </rect>
  </clipPath>
  <clipPath id="clipLine2">
    <rect x="0" y="128" width="0" height="26">
      <animate attributeName="width" from="0" to="800" dur="1.4s" begin="1.6s" fill="freeze"/>
    </rect>
  </clipPath>
  <clipPath id="clipLine3">
    <rect x="0" y="164" width="0" height="26">
      <animate attributeName="width" from="0" to="800" dur="1s" begin="3.2s" fill="freeze"/>
    </rect>
  </clipPath>

  <text x="400" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="40" letter-spacing="4" fill="#39FF14" filter="url(#glow)" clip-path="url(#clipLine1)">MANIK AGGARWAL</text>

  <text x="400" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-weight="600" font-size="18" letter-spacing="1" fill="#5EEAD4" clip-path="url(#clipLine2)">AI &amp; ML  //  SYSTEMS  //  DATA ENGINEER</text>

  <text x="400" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="16" letter-spacing="2" fill="#39FF14" clip-path="url(#clipLine3)">[ STATUS :: ONLINE ]</text>

  <rect x="497" y="171" width="10" height="18" fill="#39FF14">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
